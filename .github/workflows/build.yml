name: Build + publish image

# Builds cfg-server-factorio and publishes to ghcr.io.
#   - main branch push → :main + :main-<short-sha> ONLY — CFG-side Dockerfile
#     changes ship via a v* tag (or ride the next upstream bump), never on a
#     bare branch push
#   - tagged release (v*) → :<tag> + :latest + :<factorio-version>
#   - daily schedule → rebuild IF upstream stable moved (see below), publishing
#     :latest + :<factorio-version>; the upstream-watch workflow in
#     cfg-core-dev-tools separately opens a pin-bump PR so the move is
#     acknowledged on the record
#
# ── NOTIFY mode: the ONE org exception to "`:latest` moves only on a v* tag" ──
# Owner decision 2026-08-06, re-confirmed 2026-08-15. Every other kind repo
# gates `:latest` on v* tags alone; factorio's schedule keeps auto-shipping it
# because a stale Factorio server is not degraded, it is UNREACHABLE (exact
# client/server version match + Steam auto-updates clients — see below). The
# check-workflow-tag-coupling guard in dev-tools carries a matching carve-out.
#
# Multi-arch: linux/amd64 only. Factorio's headless binary is x86_64-glibc;
# there is no upstream arm64 build, so an arm64 image would silently
# produce an image that crashes on boot.
#
# ── Why this tracks upstream stable automatically ─────────────────────────────
# Factorio multiplayer requires an EXACT client/server version match, and Steam
# auto-updates clients. So a server pinned to an old version does not degrade —
# it becomes flatly unreachable, with the client showing "Version mismatch
# detected". Pinning at 2.0.76 while Steam shipped 2.0.77 did exactly that.
#
# The scheduled run resolves the current stable headless version and rebuilds
# only when that version has no published tag yet, so a quiet week costs one
# API call and no build. The concrete version is always published as its own
# tag alongside :latest — that tag is the rollback handle.
#
# Note on rollback: Factorio saves are forward-compatible only. A map opened by
# 2.0.77 will NOT load under 2.0.76, so rolling the image back after users have
# played strands their saves. Prefer rolling forward.

on:
  push:
    branches: [main, next]
    tags: ['v*']
  # Without this, a PR into next reports ZERO checks and merges unbuilt — the
  # first signal that the Dockerfile broke would be a push to next. A PR run
  # builds without pushing (see the login + `push:` gates below), matching
  # cfg-server-cauldronvtt and cfg-server-codeserver.
  pull_request:
    branches: [main, next]
  schedule:
    # Daily 05:00 UTC. Upstream patches are not tied to a weekday, and the
    # failure shape is an outage (version mismatch = unreachable server), so
    # the detection window should be hours, not up to six days. A quiet day
    # costs one API call and no build — the published-version check below
    # short-circuits.
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      factorio_version:
        description: 'Factorio headless version, or "stable" to resolve the current one'
        required: false
        default: 'stable'
      force:
        description: 'Build even if this version is already published'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Resolve "stable" (or an empty input, i.e. push/schedule) to the concrete
      # upstream version, so the image carries a real version in its tag+LABEL
      # and we can tell whether there is anything new to build.
      - name: Resolve Factorio version
        id: version
        run: |
          set -euo pipefail
          requested='${{ github.event.inputs.factorio_version }}'
          if [ -z "$requested" ] || [ "$requested" = 'stable' ]; then
            resolved=$(curl -fsSL https://factorio.com/api/latest-releases | jq -er '.stable.headless')
          else
            resolved="$requested"
          fi
          # Guard against a malformed/renamed API field silently becoming a tag.
          echo "$resolved" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::resolved version '$resolved' is not a semver triple"; exit 1; }
          echo "factorio=$resolved" >> "$GITHUB_OUTPUT"
          echo "Resolved Factorio headless version: $resolved"

      # A scheduled run on a quiet week should cost one API call, not a build.
      # Pushes and tags always build — the image can change without the Factorio
      # version changing (entrypoint fixes, base-image bumps).
      - name: Check whether this version is already published
        id: published
        run: |
          set -euo pipefail
          # Owner hardcoded lowercase: Docker rejects uppercase repository
          # names, and `${{ github.repository_owner }}` is `Crit-Fumble` — with
          # it, this probe failed on EVERY scheduled run (error swallowed by
          # the redirect below), so the short-circuit never fired and the
          # schedule rebuilt + republished daily. metadata-action lowercases on
          # its own, which is why the tags themselves were always fine.
          tag='ghcr.io/crit-fumble/cfg-server-factorio:${{ steps.version.outputs.factorio }}'
          if [ '${{ github.event_name }}' != 'schedule' ] || [ '${{ github.event.inputs.force }}' = 'true' ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if docker manifest inspect "$tag" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag already published — nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag not published yet — building."
          fi

      - name: Extract metadata
        id: meta
        if: steps.published.outputs.skip != 'true'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cfg-server-factorio
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=main-,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'schedule' }}
            type=raw,value=${{ steps.version.outputs.factorio }},enable=${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

      - name: Build + push
        if: steps.published.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FACTORIO_VERSION=${{ steps.version.outputs.factorio }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
